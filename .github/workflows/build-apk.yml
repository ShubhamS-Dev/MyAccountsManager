name: Build debug APK

# Manual only: Actions tab -> "Build debug APK" -> Run workflow -> pick a branch.
on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify committed Android scaffold
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            android/settings.gradle.kts
            android/build.gradle.kts
            android/app/build.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/gradlew
            android/app/src/main/AndroidManifest.xml
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required Android project file is missing: $file"
              exit 1
            fi
          done

          if ! grep -Fq 'applicationId = "com.shubhams.myaccountsmanager"' android/app/build.gradle.kts; then
            echo "::error::Android applicationId must be com.shubhams.myaccountsmanager."
            exit 1
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Cache build_runner output
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}-

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated Drift files are committed and up to date
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain --untracked-files=all -- lib)" ]]; then
            echo "::error::Generated or modified files exist under lib/. Run Drift code generation locally and commit the resulting files."
            git status --short --untracked-files=all -- lib
            exit 1
          fi

      # Caches the Gradle distribution, dependencies, and build outputs.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Android debug APK (arm64 only)
        shell: bash
        run: |
          set -o pipefail

          for attempt in 1 2 3; do
            echo "Android debug build attempt ${attempt}/3"

            if flutter build apk --debug --target-platform android-arm64 2>&1 | tee /tmp/flutter-build-apk.log; then
              exit 0
            else
              build_status=$?
            fi

            if grep -Eiq 'HTTP response code: 5[0-9]{2}|timed out|temporary failure in name resolution|connection reset|connection refused|remote host terminated the handshake|Hash of downloaded file .* does not match expected' /tmp/flutter-build-apk.log; then
              if [[ "${attempt}" -lt 3 ]]; then
                delay=$((attempt * 20))
                echo "Transient Gradle/network failure detected. Retrying in ${delay}s..."
                sleep "${delay}"
                continue
              fi

              echo "Gradle/network download failed after 3 attempts."
            else
              echo "Build failed for a non-transient reason; not retrying."
            fi

            exit "${build_status}"
          done

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myaccountsmanager-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
