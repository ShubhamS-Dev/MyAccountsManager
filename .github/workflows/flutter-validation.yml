name: Flutter validation

on:
  push:
    branches:
      - "feature/**"
      - "development/**"
    paths-ignore:
      - "**/*.g.dart"
  pull_request:
    branches:
      - "development/**"
      - master

permissions:
  contents: write

jobs:
  validate:
    timeout-minutes: 15
    concurrency:
      group: flutter-validation-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format Dart source
        run: dart format .

      - name: Commit generated and formatted Dart source
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- lib test
          if ! git diff --cached --quiet; then
            git commit -m "Apply Dart fixes and formatting [skip ci]"
            git push
          fi

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded --timeout 2m
