name: Flutter validation

on:
  push:
    branches:
      - "feature/**"
      - "development/**"
    paths-ignore:
      - "**/*.g.dart"
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - "development/**"
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: flutter-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: codegen, format, analyze, tests. Also commits generated source.
  check:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true # caches the Flutter SDK and the pub cache

      - name: Generate Android platform scaffold when missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.shubhams --project-name myaccountsmanager .
          fi
          if ! grep -Rqs "com.shubhams.myaccountsmanager" android/app; then
            echo "Expected Android application ID com.shubhams.myaccountsmanager was not generated."
            exit 1
          fi

      - name: Install Linux SQLite development library
        run: |
          dpkg -s libsqlite3-dev >/dev/null 2>&1 || \
            (sudo apt-get update && sudo apt-get install -y libsqlite3-dev)

      - name: Resolve dependencies
        run: flutter pub get

      - name: Cache build_runner output
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format Dart source
        run: dart format .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded --timeout 2m

      - name: Commit validated generated source, Android scaffold, and dependency lockfile
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- android lib test pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m "Add validated Android platform and generated source [skip ci]"
            git push
          fi
