name: Flutter validation

on:
  push:
    branches:
      - "feature/**"
      - "development/**"
    paths-ignore:
      - "**/*.g.dart"
  pull_request:
    branches:
      - "development/**"
      - master

permissions:
  contents: write

jobs:
  validate:
    timeout-minutes: 30
    concurrency:
      group: flutter-validation-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold when missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.shubhams --project-name myaccountsmanager .
          fi
          if ! grep -Rqs "com.shubhams.myaccountsmanager" android/app; then
            echo "Expected Android application ID com.shubhams.myaccountsmanager was not generated."
            exit 1
          fi

      - name: Install Linux SQLite development library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Format Dart source
        run: dart format .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded --timeout 2m --concurrency=1

      - name: Cache Gradle distributions and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android debug APK
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Android debug build attempt ${attempt}/3"
            if flutter build apk --debug 2>&1 | tee /tmp/flutter-build-apk.log; then
              exit 0
            else
              build_status=$?
            fi

            if grep -Eiq 'HTTP response code: 5[0-9]{2}|timed out|temporary failure in name resolution|connection reset|connection refused|remote host terminated the handshake' /tmp/flutter-build-apk.log; then
              if [ "${attempt}" -lt 3 ]; then
                delay=$((attempt * 20))
                echo "Transient Gradle/network failure detected. Retrying in ${delay}s..."
                sleep "${delay}"
                continue
              fi
              echo "Gradle/network download failed after 3 attempts."
            else
              echo "Build failed for a non-transient reason; not retrying."
            fi
            exit "${build_status}"
          done

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myaccountsmanager-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit validated generated source, Android scaffold, and dependency lockfile
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- android lib test pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m "Add validated Android platform and generated source [skip ci]"
            git push
          fi
