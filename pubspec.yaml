name: my_accounts_manager
description: An offline-first personal finance manager with an independent MyKhata ledger.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  cupertino_icons: ^1.0.8
  drift: ^2.28.1
  sqlite3: 3.8.0
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.28.1

flutter:
  uses-material-design: true

# Use the runner's installed SQLite for Linux CI tests. Android and other
# targets continue using sqlite3's bundled, checksum-verified native assets.
hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
